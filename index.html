<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Menu Design Using JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hero">
        <div class="selector">
            <div id="selectField">
                <p id="selectText">Select Social Media</p>
                <img id="arrowIcon" src="assets/images/arrow.png">
            </div>
            <ul id="list" class="hide">
                <li class="options">
                    <img src="assets/images/facebook.png">
                    <p>Facebook</p>
                </li>
                <li class="options"> 
                    <img src="assets/images/youtube.png">
                    <p>Youtube</p>
                </li >
                <li class="options">
                    <img src="assets/images/instagram.png">
                    <p>Instagram</p>
                </li>
                <li class="options"> 
                    <img src="assets/images/twitter.png">
                    <p>Twitter</p>
                </li>
                <li class="options">
                    <img src="assets/images/pinterest.png">
                    <p>Pinterest</p>
                </li>
                <li class="options">
                    <img src="assets/images/whatsapp.png">
                    <p>Whatsapp</p>
                </li>
            </ul>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
